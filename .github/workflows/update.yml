name: Update Vangst24

on:
  schedule:
    - cron: "7 */4 * * *"   # every 4 hours (fits the free YouTube quota)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
    inputs:
      forecast_only:
        description: "Alleen het visweer verversen (kost geen YouTube-limiet)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find new videos and forecast
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python finder/find_videos.py ${{ inputs.forecast_only && '--forecast-only' || '' }}
      - name: Save the results
        run: |
          git config user.name "vangst24-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data planning
          git diff --cached --quiet || git commit -m "Update videos and forecast"
          git push
